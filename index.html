<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Disease Detector - Organic Care</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #2d5a27, #a8d98f);
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .card {
        background: #fff;
        border-radius: 16px;
        padding: 28px;
        max-width: 560px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    h1 {
        font-size: 22px;
        color: #234d20;
        text-align: center;
        margin-bottom: 4px;
    }
    p.subtitle {
        text-align: center;
        color: #666;
        font-size: 13px;
        margin-bottom: 20px;
    }
    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
    }
    .tab-btn {
        flex: 1;
        padding: 10px;
        border: 2px solid #2d5a27;
        background: #fff;
        color: #2d5a27;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
    }
    .tab-btn.active {
        background: #2d5a27;
        color: #fff;
    }
    .panel { display: none; }
    .panel.active { display: block; }

    #cameraContainer {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        margin-bottom: 12px;
        display: none;
    }
    #video { width: 100%; display: block; }
    .scan-frame {
        position: absolute;
        top: 15%; left: 15%; right: 15%; bottom: 15%;
        border: 3px solid #4CAF50;
        border-radius: 12px;
        pointer-events: none;
        box-shadow: 0 0 0 2000px rgba(0,0,0,0.25);
    }
    .camera-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
    }
    button.action-btn {
        flex: 1;
        padding: 12px;
        background: #2d5a27;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }
    button.action-btn:hover { background: #234d20; }
    button.action-btn:disabled { background: #999; cursor: not-allowed; }
    button.secondary { background: #777; }

    .upload-box {
        border: 2px dashed #2d5a27;
        border-radius: 12px;
        padding: 30px 20px;
        text-align: center;
        cursor: pointer;
        margin-bottom: 12px;
    }
    .upload-box:hover { background: #f5faf3; }
    #fileInput { display: none; }

    #previewImg {
        width: 100%;
        border-radius: 12px;
        display: none;
        margin-bottom: 12px;
        max-height: 300px;
        object-fit: cover;
    }

    #loading {
        display: none;
        text-align: center;
        padding: 20px;
        color: #2d5a27;
        font-weight: 600;
    }

    #result { display: none; margin-top: 18px; }
    .result-header {
        padding: 16px;
        border-radius: 10px;
        text-align: center;
        margin-bottom: 14px;
    }
    .result-header.healthy { background: #e3fff0; border: 2px solid #2ecc71; }
    .result-header.disease { background: #fff3e0; border: 2px solid #ff9800; }
    .result-header h2 { font-size: 19px; margin-bottom: 4px; color: #234d20; }
    .result-header p { font-size: 13px; color: #555; }

    .section-title {
        font-size: 15px;
        font-weight: 700;
        color: #2d5a27;
        margin: 14px 0 6px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    ul.remedy-list {
        list-style: none;
        padding: 0;
    }
    ul.remedy-list li {
        background: #f3f9f0;
        border-left: 4px solid #4CAF50;
        padding: 10px 12px;
        margin-bottom: 8px;
        border-radius: 6px;
        font-size: 13.5px;
        color: #333;
        line-height: 1.4;
    }
    ul.prevention-list li {
        background: #eef6ff;
        border-left: 4px solid #4a90d9;
    }
    .desc-box {
        background: #fafafa;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13.5px;
        color: #444;
        margin-bottom: 6px;
        line-height: 1.5;
    }
    .error { color: #d32f2f; text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
    <h1>🌿 Plant Disease Detector</h1>
    <p class="subtitle">Scan a leaf via camera or upload a photo &mdash; get organic treatment advice</p>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('camera')">📷 Live Scan</button>
        <button class="tab-btn" onclick="switchTab('upload')">🖼️ Upload Photo</button>
    </div>

    <!-- CAMERA PANEL -->
    <div id="cameraPanel" class="panel active">
        <div id="cameraContainer">
            <video id="video" autoplay playsinline></video>
            <div class="scan-frame"></div>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
        <div class="camera-controls">
            <button class="action-btn" id="startCameraBtn" onclick="startCamera()">Start Camera</button>
            <button class="action-btn" id="captureBtn" onclick="capturePhoto()" style="display:none;">📸 Capture & Scan</button>
            <button class="action-btn secondary" id="stopCameraBtn" onclick="stopCamera()" style="display:none;">Stop</button>
        </div>
    </div>

    <!-- UPLOAD PANEL -->
    <div id="uploadPanel" class="panel">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p>📁 Tap to select a leaf photo from gallery</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">
    </div>

    <img id="previewImg" alt="Preview">
    <div id="loading">🔬 Analyzing leaf... please wait</div>
    <div id="errorMsg" class="error"></div>
    <div id="result"></div>
</div>

<script>
let stream = null;

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    if (tab === 'camera') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('cameraPanel').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('uploadPanel').classList.add('active');
        stopCamera();
    }
}

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        document.getElementById('cameraContainer').style.display = 'block';
        document.getElementById('startCameraBtn').style.display = 'none';
        document.getElementById('captureBtn').style.display = 'block';
        document.getElementById('stopCameraBtn').style.display = 'block';
    } catch (err) {
        document.getElementById('errorMsg').textContent = 'Could not access camera. Please allow camera permission or use Upload Photo instead.';
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
    document.getElementById('cameraContainer').style.display = 'none';
    document.getElementById('startCameraBtn').style.display = 'block';
    document.getElementById('captureBtn').style.display = 'none';
    document.getElementById('stopCameraBtn').style.display = 'none';
}

function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const base64Image = canvas.toDataURL('image/jpeg', 0.9);

    document.getElementById('previewImg').src = base64Image;
    document.getElementById('previewImg').style.display = 'block';

    sendForPrediction({ image_base64: base64Image });
}

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('previewImg').src = e.target.result;
        document.getElementById('previewImg').style.display = 'block';
    };
    reader.readAsDataURL(file);

    const formData = new FormData();
    formData.append('image', file);
    sendForPrediction(formData, true);
}

async function sendForPrediction(payload, isFormData = false) {
    const loading = document.getElementById('loading');
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('errorMsg');

    resultDiv.style.display = 'none';
    errorDiv.textContent = '';
    loading.style.display = 'block';

    try {
        let response;
        if (isFormData) {
            response = await fetch('/predict', { method: 'POST', body: payload });
        } else {
            response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        const data = await response.json();
        loading.style.display = 'none';

        if (data.error) {
            errorDiv.textContent = data.error;
            return;
        }

        renderResult(data);
    } catch (err) {
        loading.style.display = 'none';
        errorDiv.textContent = 'Something went wrong. Please try again.';
    }
}

function renderResult(data) {
    const resultDiv = document.getElementById('result');
    const isHealthy = data.predicted_class.toLowerCase().includes('healthy');
    const remedy = data.remedy;

    let html = `
        <div class="result-header ${isHealthy ? 'healthy' : 'disease'}">
            <h2>${isHealthy ? '✅' : '🩺'} ${remedy.disease_name}</h2>
            <p>Confidence: ${data.confidence}%</p>
        </div>
        <div class="desc-box">${remedy.description}</div>
    `;

    if (remedy.organic_remedies && remedy.organic_remedies.length > 0) {
        html += `<div class="section-title">🌱 Organic Treatment</div><ul class="remedy-list">`;
        remedy.organic_remedies.forEach(r => html += `<li>${r}</li>`);
        html += `</ul>`;
    }

    if (remedy.prevention_tips && remedy.prevention_tips.length > 0) {
        html += `<div class="section-title">🛡️ Prevention Tips</div><ul class="remedy-list prevention-list">`;
        remedy.prevention_tips.forEach(r => html += `<li>${r}</li>`);
        html += `</ul>`;
    }

    if (data.top3 && data.top3.length > 1) {
        html += `<div class="section-title">📊 Other Possibilities</div><ul class="remedy-list">`;
        data.top3.slice(1).forEach(t => html += `<li>${t.class.replace(/_/g, ' ')} — ${t.confidence}%</li>`);
        html += `</ul>`;
    }

    resultDiv.innerHTML = html;
    resultDiv.style.display = 'block';
}
</script>
</body>
</html>
